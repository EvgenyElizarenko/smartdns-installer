name: ShellCheck & Bash Syntax

on:
  push:
    branches: [ main, "dev/**" ]
  pull_request:
    branches: [ main, "dev/**" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bash Syntax & ShellCheck
        run: |
          bash -n smartdns-installer-v3.0-stealth.sh
          for f in old/*.sh; do
            [ -e "$f" ] && bash -n "$f"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S error smartdns-installer-v3.0-stealth.sh
          fi
