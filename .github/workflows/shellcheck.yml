name: Bash Syntax & ShellCheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Validate Bash Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Linux LF line endings
        run: |
          if grep -q $'\r' smartdns-installer.sh; then
            echo "ERROR: CRLF line endings detected in smartdns-installer.sh"
            exit 1
          fi

      - name: Run Bash syntax check (bash -n)
        run: bash -n smartdns-installer.sh

      - name: Run ShellCheck static analysis
        run: shellcheck -S warning -e SC1090,SC2034,SC2154 smartdns-installer.sh

      - name: Run Python automated test suites
        run: |
          python3 tests/test_v401_audit_fixes.py
          python3 tests/test_v402_hardening.py
          python3 tests/test_telegram_bot.py
          python3 tests/test_hostname_profile.py
          python3 tests/test_nspawn_second_ip.py
