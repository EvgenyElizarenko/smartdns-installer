name: Bash Syntax & ShellCheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Validate Bash Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Linux LF line endings
        run: |
          if grep -q $'\r' smartdns-installer-v3.1.0-stealth.sh; then
            echo "ERROR: CRLF line endings detected in smartdns-installer-v3.1.0-stealth.sh"
            exit 1
          fi

      - name: Run Bash syntax check (bash -n)
        run: bash -n smartdns-installer-v3.1.0-stealth.sh

      - name: Run ShellCheck static analysis
        run: shellcheck -S warning -e SC1090,SC2034,SC2154 smartdns-installer-v3.1.0-stealth.sh
