name: Auto Release (Latest)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v4.0.0-stealth)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Verify syntax and prepare release assets
        run: |
          bash -n smartdns-installer.sh
          mkdir -p release-assets
          cp -p smartdns-installer.sh release-assets/smartdns-installer.sh
          (
            cd release-assets
            sha256sum smartdns-installer.sh > SHA256SUMS.txt
          )

      - name: Create or update GitHub Release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists — updating assets and latest flag..."
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            gh release edit "${RELEASE_TAG}" --title "SmartDNS Installer ${RELEASE_TAG}" --latest
          else
            echo "Creating new release ${RELEASE_TAG}..."
            gh release create "${RELEASE_TAG}" release-assets/* \
              --title "SmartDNS Installer ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi
